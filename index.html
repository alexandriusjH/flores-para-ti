<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6ba24"><title>Unas flores para ti</title>
  <style>
    :root{--ink:#3c2a17;--gold:#f8c429}*{box-sizing:border-box}html,body,main{width:100%;min-height:100%;margin:0}body{overflow:hidden;color:var(--ink);font-family:Arial,sans-serif}main{min-height:100svh;position:relative}.welcome,.garden{inset:0;min-height:100svh;display:grid;place-items:center;position:absolute;overflow:hidden}.welcome{background:#fffaf0;z-index:2;text-align:center;padding:24px;transition:opacity .75s ease,visibility .75s ease}.welcome:before{content:"";width:min(78vw,690px);aspect-ratio:1;border:1px solid #f0dcae;border-radius:50%;position:absolute;opacity:.7}.welcome:after{content:"";width:min(58vw,510px);aspect-ratio:1;border:1px dashed #efcf83;border-radius:50%;position:absolute;animation:turn 30s linear infinite}.welcome>*:not(.sun-glow){position:relative;z-index:1}.eyebrow{align-self:end;margin:0 0 -23vh;letter-spacing:.18em;text-transform:uppercase;color:#a87832;font-size:clamp(.65rem,1.7vw,.8rem);font-weight:bold}.welcome h1{margin:2rem 0 0;font-family:Georgia,serif;font-size:clamp(2.7rem,8vw,5.8rem);line-height:.97;max-width:700px}.intro{position:absolute!important;top:calc(50% + 92px);margin:0;color:#806744;font-size:clamp(.95rem,2vw,1.05rem)}button{cursor:pointer}.press-button{position:absolute!important;top:calc(50% + 155px);border:0;color:#fffdf8;background:var(--ink);border-radius:999px;padding:16px 22px 16px 27px;font-weight:bold;font-size:1rem;box-shadow:0 12px 25px #3a29172e;transition:.25s}.press-button i{font-style:normal;color:#ffd34c;margin-left:9px}.press-button:hover{transform:translateY(-4px) scale(1.02)}.sun-glow{width:310px;height:310px;border-radius:50%;filter:blur(20px);position:absolute;opacity:.35;background:#ffd969}.glow-one{top:-140px;left:-100px}.glow-two{right:-90px;bottom:-150px;background:#f5c245}.garden{z-index:1;background:radial-gradient(circle at 50% 15%,#ffe98c 0,transparent 37%),linear-gradient(160deg,#facb3d,#f5b626 55%,#eaa31e);opacity:0;transition:opacity .75s}.garden:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 62%,#6754131a);pointer-events:none}.sun-disc{position:absolute;width:min(80vw,690px);aspect-ratio:1;border-radius:50%;top:-53vw;background:#fff6bb38;box-shadow:0 0 0 40px #fff3a214,0 0 0 100px #ffed7910}.message-card{width:min(88vw,690px);padding:clamp(32px,7vw,66px) clamp(22px,7vw,70px);z-index:3;text-align:center;border:1px solid #69480f2e;border-radius:26px;background:#fffae5ad;box-shadow:0 24px 70px #784c0030;backdrop-filter:blur(8px);transform:translateY(25px) scale(.96);opacity:0;transition:transform .9s cubic-bezier(.16,1,.3,1) .16s,opacity .7s ease .16s}.tiny-note{color:#99712d;margin:0 0 16px;text-transform:uppercase;letter-spacing:.13em;font-size:clamp(.6rem,1.6vw,.72rem);font-weight:bold}.message-card h2{margin:0;font:600 clamp(2rem,5.1vw,4rem)/1.13 Georgia,serif;letter-spacing:-.035em}.message-card h2 em{color:#9a5614}.signature{margin:17px 0 0;color:#806334;font-size:.92rem}.again-button{display:none;border:0;border-bottom:1px solid #8c642c;background:transparent;color:#64451d;margin-top:18px;padding:3px 1px;font-size:.82rem}.flower{position:absolute;z-index:2;width:var(--size);height:var(--size);left:var(--left);top:calc(-1 * var(--size) - 30px);animation:fall var(--duration) linear var(--delay) infinite,sway 2.7s ease-in-out var(--delay) infinite alternate}.head{width:50%;height:50%;position:absolute;left:25%;top:5%;border-radius:50%;background:#79451f;box-shadow:0 0 0 calc(var(--size)*.035) #6f3e1b}.head:before{content:"";position:absolute;inset:-56%;border-radius:50%;background:repeating-conic-gradient(from 4deg,#f6c82d 0 12deg,transparent 12deg 25.7deg);z-index:-1}.head:after{content:"";position:absolute;inset:20%;border-radius:50%;background:repeating-radial-gradient(circle,#70401d 0 2px,#8a5122 3px 5px)}.stem{position:absolute;height:52%;width:max(3px,calc(var(--size)*.055));left:calc(50% - var(--size)*.027);top:46%;border-radius:10px;background:#52723a;transform:rotate(-5deg)}.leaf{width:32%;height:17%;border-radius:100% 0 100% 0;position:absolute;background:#628442;top:64%;left:49%;transform:rotate(-19deg)}.leaf:last-child{top:76%;left:21%;transform:scaleX(-1) rotate(-17deg)}.card-flower{height:42px;width:42px;border-radius:50%;background:#75421d;margin:23px auto 0;position:relative;box-shadow:0 0 0 3px #75421d}.card-flower:before{content:"";position:absolute;inset:-16px;border-radius:50%;background:repeating-conic-gradient(#f8c82e 0 14deg,transparent 14deg 30deg);z-index:-1}.card-flower span{display:block;margin:12px;height:18px;border-radius:50%;background:#9d6026}body.revealed .welcome{opacity:0;visibility:hidden;pointer-events:none}body.revealed .garden{opacity:1}body.revealed .message-card{opacity:1;transform:translateY(0) scale(1)}body.revealed .again-button{display:inline-block}@keyframes fall{to{top:calc(100vh + var(--size))}}@keyframes sway{from{margin-left:-17px;rotate:-16deg}to{margin-left:17px;rotate:18deg}}@keyframes turn{to{rotate:360deg}}@media(max-width:520px){.eyebrow{margin-bottom:-20vh}.intro{top:calc(50% + 74px)}.press-button{top:calc(50% + 130px)}.message-card{border-radius:21px}.message-card h2 br{display:none}.sun-disc{top:-73vw}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    /* Pantalla inicial: distribución fluida, sin elementos superpuestos. */
    .welcome { display:flex; flex-direction:column; justify-content:center; gap:18px; }
    .welcome .eyebrow { align-self:auto; margin:0 0 8px; }
    .welcome h1 { margin:0; }
    .welcome .intro { position:relative!important; top:auto; margin:0; }
    .welcome .press-button { position:relative!important; top:auto; margin:10px 0 0; }
    @media(max-width:520px){ .welcome { gap:14px; } .welcome .eyebrow{margin:0 0 6px} .welcome .intro,.welcome .press-button{top:auto} }
  </style>
</head>
<body><main>
  <section class="welcome"><div class="sun-glow glow-one"></div><div class="sun-glow glow-two"></div><p class="eyebrow">Un pequeño detalle para ti</p><h1>Hay algo esperándote</h1><p class="intro">Toca el botón y déjate sorprender.</p><button class="press-button" id="revealButton"><span>Presióname</span> <i>✦</i></button></section>
  <section class="garden" aria-live="polite"><div class="sun-disc"></div><div class="flowers" id="flowers" aria-hidden="true"></div><div class="message-card"><p class="tiny-note">Para alguien que hace mis días más bonitos</p><h2>Sé que no puedo darte flores,<br><em>pero puedo programarlas para ti.</em></h2><div class="card-flower"><span></span></div><p class="signature">Con cariño, para ti ♡</p><button class="again-button" id="againButton">Verlas otra vez</button></div></section>
</main><audio id="backgroundMusic" loop preload="auto"><source src="assets/YTDown.com_YouTube_Manuel-Medrano-Bajo-El-Agua-Video-Oficia_Media_zLX_GcXt2pI_009_128k.mp3" type="audio/mpeg"></audio><script>
const b=document.querySelector('#revealButton'),a=document.querySelector('#againButton'),f=document.querySelector('#flowers'),m=document.querySelector('#backgroundMusic');function make(i){const e=document.createElement('div'),s=52+Math.random()*62;e.className='flower';e.style.setProperty('--size',s+'px');e.style.setProperty('--left',Math.random()*100+'%');e.style.setProperty('--duration',6.5+Math.random()*4.5+'s');e.style.setProperty('--delay',i*.26+Math.random()*.6+'s');e.innerHTML='<div class="head"></div><div class="stem"></div><div class="leaf"></div><div class="leaf"></div>';f.appendChild(e)}function shower(){f.replaceChildren();for(let i=0;i<(matchMedia('(max-width:520px)').matches?15:24);i++)make(i)}b.onclick=()=>{document.body.classList.add('revealed');shower();m.play().catch(()=>{})};a.onclick=shower;
</script></body></html>
